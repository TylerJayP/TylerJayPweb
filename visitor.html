<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <section id="validationForm">
        <form id="validateForm">
            <p>Please fill out the Registration form below</p>
            <h1>**No information is saved when you click the "Register" button**</h1>
            <div>
               <label for="firstName">First Name</label>
               <input type="text" id="firstName" name="firstName">
            </div>

            <div>
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName">
             </div>

            <div>
                <label for="address">Address</label>
                <input type="text" id="address" name="address">
             </div>

             <div>
                <label for="city">City</label>
                <input type="text" id="city" name="city" >
             </div>    

             <div>
                <label for="state">State</label>
                <input type="text" id="state" name="state">
             </div>

             <div>
                <label for="zip">Zip</label>
                <input type="text" id="zip" name="zip" >
             </div>

             <div>
                <label for="phoneNumber">Phone Number</label>
                <input type="text" id="phoneNumber" name="phoneNumber">
             </div>

             <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" >
             </div>

             <div>
               <label for="findOut">How'd you find me</label>
             </div>

             <!--I want to add css to make my checkboxes custom, but it's not
            something required for my assignment so, I'll hold off for now as I
            know I will get too caught up into getting it right when I could spend
            my time on things that matter for my project :)-->
             <div>
               <label>
                  <input type="checkbox" name="check" value="Internet">
                  Internet
              </label>
             </div>

             <div>
              <label>
                  <input type="checkbox" name="check" value="Friend">
                  Friend
              </label>
             </div>

             <div>
              <label>
                  <input type="checkbox" name="check" value="Google">
                  Google
              </label>
             </div>

             <div>
              <label>
                  <input type="checkbox" name="check" value="Other">
                  Other
              </label>
            </div>

            <div id="additionalComments">
               <label for="comments">Additional Comments (Optional)</label>
               <textarea id="comments" name="comments" style="resize: vertical;" rows="1"></textarea>
            </div>

            <div id="formErrors"></div>

            <div>
               <input type="submit" id="submit" value="Register">
            </div>
        </form>

        <div id="thankYouMessage" style="display: none;">
         <h1>Thank you for your submission!</h1>
         <p>PLEASE REMEMBER, NONE OF YOUR DATA WAS ACTUALLY RECORDED.</p>
         
        </div>
    </section>
    <script src="validate.js"></script>
</body>
</html>
