<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href=https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css>
    <link rel="googleapis" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="darkstyles.css">
    <title>Document</title>
</head>
<body>
    <main>
        <div class="contactContainer">
        <div class="contactText">
            <h1>Whether you're a hiring manager, a developer, or anyone with inquiries, 
                I'd love to hear from you. Please take a moment to fill out the contact form below, and I'll get back to you promptly. 
            </h1>
        </div>

        <nav>
            <ul class="nav-links" id="navLinks">
                <li class="link"><a href="index.html">Home</a></li> 
                <li class="link"><a href="">Projects</a></li> 
                <li class="link"><a href="">Resume</a></li> 
            </ul>
        </nav>

        <div class="contactForm" id="contactForm">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="Give some context..." required>
        
            <label for="company">Company (If Applicable)</label>
            <input type="text" id="fname" name="fname" placeholder="Your company name...">

            <label for="fname">First Name</label>
            <input type="text" id="fname" name="fname" placeholder="Your first name..." required>
        
            <label for="lname">Last Name</label>
            <input type="text" id="lname" name="lname" placeholder="Your last name..." required>
                
            <label for="message">Message</label>
            <textarea id="messageTextArea" name="message" placeholder="Write something..." style="height: 200px;" required></textarea>
        
            <input type="submit" value="Submit">
        </div>  
    </div>
</main>
</body>
</html>
